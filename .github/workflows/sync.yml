name: sync

on:
  schedule:
    - cron: "0 0 */14 * *"
  workflow_dispatch:
  push:
    paths:
      - src/data.yml
      - src/systems.yml
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run build
