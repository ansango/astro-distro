name: sync

on:
  schedule:
    - cron: "0 0 */14 * *"
  workflow_dispatch:
  push:
    paths:
      - src/queue.yml
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Sync from queue
        run: bun run sync

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "ansango"
          git config user.email "ansango@users.noreply.github.com"
          git add src/config.json
          git commit -m "chore: sync from queue [skip ci]"
          git push
