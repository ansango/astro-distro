name: Bug Report
description: Report something that's broken
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      content: Thanks for taking the time to report a bug.
  - type: textarea
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I run `bun run sync` the build fails with…
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Steps to reproduce, if applicable.
      placeholder: |
        1. Edit `src/data.yml` …
        2. Run `bun run sync` …
        3. See error
  - type: textarea
    attributes:
      label: Environment
      description: Bun / Node / Astro versions, OS, anything relevant.
      placeholder: |
        - bun 1.3.14
        - astro 7.x
        - macOS 15
  - type: dropdown
    attributes:
      label: Where
      description: Where does the bug live?
      options:
        - Build / sync script
        - Astro page / component
        - SEO output
        - Theme switcher
        - Other
