site:
  title: astro-distro
  description: Astro + Tailwind fastfetch-style portfolio template. TUI components, themeable systems, projects synced from GitHub via YAML.
  url: https://astro-distro.pages.dev
  author: astro
  handle_suffix: distro
  image: /og.png
  image_width: 1200
  image_height: 630
  theme_color: '#1793d1'
  job_title: astro-distro template
  social:
    github: ansango/astro-distro
  twitter: ''
  locale: en
  type: website
  default_theme: debian
  footer:
    status: session closed
    errors: 0
    warnings: 0
    uptime: 5y

current: debian
booted_at: '2026-08-20T10:00:00Z'
host:
  name: devbox
  cpu: AMD Ryzen 7 7700
  gpu: AMD Radeon RX 7700 XT
  memory: 32 GB DDR5
  resolution: 2560x1440
about:
  command: lazygit --view bio
  status:
    branch: main
    since: 2026
    ahead: 1
    behind: 0
    modified: 2
    untracked: 0
  bio:
    - icon: M
      text: Astro + Tailwind template for fastfetch-style portfolios
    - icon: M
      text: Single source of truth — content in YAML, generated in JSON
    - icon: M
      text: 26 distro themes, switchable from the header with no flash
    - icon: M
      text: Projects synced from GitHub, cached locally for 1 hour
    - icon: M
      text: SEO out of the box — OG, Twitter, JSON-LD, robots.txt
    - icon: M
      text: TypeScript strict, biome, bun test, GitHub Actions
    - icon: ??
      text: Fork this repo and edit data.yml to make it yours
  paths:
    - name: main
      current: true
    - name: feature/themes
    - name: feature/seo
    - name: feature/sync-script
    - name: feature/yaml-config
    - name: fix/components
    - name: docs/readme
uses:
  command: btop --view stack — daily usage && hardware
  cpu:
    label: CPU [daily usage]
    usage:
      - label: editor
        percent: 100
        detail: zed / vscode
      - label: terminal
        percent: 60
        detail: alacritty + tmux
      - label: browser
        percent: 20
        detail: firefox / brave
      - label: notes
        percent: 10
        detail: obsidian
        note: (markdown sync)
      - label: music
        percent: 10
        detail: navidrome
        note: (lastfm scrobbling)
      - label: theme
        percent: 50
        detail: tokyo night
      - label: font
        percent: 40
        detail: JetBrains Mono
  memory:
    used: 16
    total: 32
    theme: tokyo night
    themePercent: 50
  hardware:
    label: hardware
    device: devbox
    ram: 32 GB DDR5
    os: Debian 13 Trixie
  peripherals:
    label: peripherals
    keyboard: Keychron K6
    mouse: Logitech G Pro
    headphones: generic
    monitor: 2 x 27" 1440p
contact:
  command: mutt -f ansango@dev
  email: ansango@dev
  inbox:
    - from: github.com/ansango
      date: 15 Aug 2014
      href: https://github.com/ansango
    - from: hola@ansango.com
      date: 10 Jan 2019
      href: mailto:hola@ansango.com
    - from: ansango.com
      date: 10 Jan 2019
      href: https://ansango.com
  hints:
    - key: j/k
      action: next
    - key: enter
      action: open
    - key: q
      action: quit
projects_ui:
  command: ranger /home/astro/projects
  root: /home/astro
projects:
  - https://github.com/ansango/astro-distro
